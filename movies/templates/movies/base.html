<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}MovieTrack{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{% url 'home' %}"
        >
            MovieTrack
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'home' %}"
                    >
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'movie_list' %}"
                    >
                        Movies
                    </a>
                </li>

                {% if user.is_authenticated %}

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'watchlist' %}"
                        >
                            My Watchlist
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'my_lists' %}"
                        >
                            My Lists
                        </a>
                    </li>

                {% endif %}

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'about' %}"
                    >
                        About
                    </a>
                </li>

            </ul>

            <ul class="navbar-nav align-items-lg-center">

                {% if user.is_authenticated %}

                    <li class="nav-item">
                        <span class="navbar-text me-lg-3">
                            {{ user.username }}
                        </span>
                    </li>

                    <li class="nav-item">

                        <form
                            method="post"
                            action="{% url 'logout' %}"
                            class="m-0"
                        >
                            {% csrf_token %}

                            <button
                                type="submit"
                                class="btn btn-link nav-link border-0 p-0"
                            >
                                Logout
                            </button>

                        </form>

                    </li>

                {% else %}

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'join' %}"
                        >
                            Join
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'login' %}"
                        >
                            Login
                        </a>
                    </li>

                {% endif %}

            </ul>

        </div>

    </div>

</nav>


<main>

    {% block content %}
    {% endblock %}

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>

</body>

</html>
