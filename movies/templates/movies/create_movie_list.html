{% extends "movies/base.html" %}

{% block title %}Create List | MovieTrack{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <h1 class="mb-4">
                Create New List
            </h1>

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        List Name
                    </label>

                    {{ form.name }}

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create List
                </button>

                <a
                    href="{% url 'my_lists' %}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
