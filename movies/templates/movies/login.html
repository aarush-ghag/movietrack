{% extends "movies/base.html" %}

{% block title %}Login | MovieTrack{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-5">

            <h1 class="mb-4">
                Login
            </h1>

            {% if form.errors %}

                <div class="alert alert-danger">
                    Your username or password was incorrect.
                </div>

            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required
                        autofocus
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >

                </div>

                {% if next %}
                    <input
                        type="hidden"
                        name="next"
                        value="{{ next }}"
                    >
                {% endif %}

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Login
                </button>

            </form>

            <p class="mt-4 text-center">
                Don't have an account?

                <a href="{% url 'join' %}">
                    Join MovieTrack
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
